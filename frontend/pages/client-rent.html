<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Cliente Reservar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="customer" data-section="rent"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Reservar" data-subtitle="Solicitud de alquiler"></div>

      <section class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Crear reserva</h4>
          <button class="rt-btn-primary" id="openRentalModal">Nueva reserva</button>
        </div>
        <div class="rt-alert mt-3">Selecciona la herramienta disponible y define fechas. El Provider ID debe ser ingresado según el backend.</div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="rentalModal" tabindex="-1" aria-labelledby="rentalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="rentalLabel">Nueva reserva</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="rentalForm">
            <div class="rt-grid rt-grid-2">
              <div class="rt-form-group">
                <label>Herramienta</label>
                <select class="rt-input" id="toolId" required></select>
              </div>
              <div class="rt-form-group">
                <label>Provider ID</label>
                <input class="rt-input" id="providerId" required>
              </div>
              <div class="rt-form-group">
                <label>Fecha inicio</label>
                <input class="rt-input" id="startDate" type="date" required>
              </div>
              <div class="rt-form-group">
                <label>Fecha fin</label>
                <input class="rt-input" id="endDate" type="date" required>
              </div>
              <div class="rt-form-group">
                <label>Total estimado</label>
                <input class="rt-input" id="totalAmount" type="number" step="0.01" required>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="rt-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="rt-btn-primary" id="submitRental">Solicitar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/validators.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['CUSTOMER']);

    const rentalModal = new bootstrap.Modal(document.getElementById('rentalModal'));
    const toolSelect = UI.qs('#toolId');
    let toolsCache = [];

    async function loadAvailableTools() {
      toolsCache = await Api.apiClient.get('/api/tools/available');
      toolSelect.innerHTML = toolsCache.map(t => `<option value="${t.id}">${t.name} (${t.categoryName || ''})</option>`).join('');
      if (!toolsCache.length) {
        toolSelect.innerHTML = '<option value="">Sin herramientas disponibles</option>';
      }
    }

    function calculateTotal() {
      const tool = toolsCache.find(t => t.id === toolSelect.value);
      const start = UI.qs('#startDate').value;
      const end = UI.qs('#endDate').value;
      if (!tool || !start || !end) return;
      const s = new Date(start);
      const e = new Date(end);
      const days = Math.max(1, Math.ceil((e - s) / (1000 * 60 * 60 * 24)) + 1);
      if (tool.dailyRate) {
        UI.qs('#totalAmount').value = (days * tool.dailyRate).toFixed(2);
      } else if (tool.hourlyRate) {
        UI.qs('#totalAmount').value = (days * 8 * tool.hourlyRate).toFixed(2);
      }
    }

    UI.qs('#openRentalModal').addEventListener('click', () => {
      rentalModal.show();
    });

    toolSelect.addEventListener('change', calculateTotal);
    UI.qs('#startDate').addEventListener('change', calculateTotal);
    UI.qs('#endDate').addEventListener('change', calculateTotal);

    UI.qs('#submitRental').addEventListener('click', async () => {
      const payload = {
        toolId: UI.qs('#toolId').value.trim(),
        providerId: UI.qs('#providerId').value.trim(),
        startDate: UI.qs('#startDate').value,
        endDate: UI.qs('#endDate').value,
        totalAmount: Number(UI.qs('#totalAmount').value)
      };
      if (!payload.toolId || !payload.providerId) {
        UI.toast('Selecciona herramienta y provider.', 'warning');
        return;
      }
      if (!Validators.dateRange(payload.startDate, payload.endDate)) {
        UI.toast('Rango de fechas inválido', 'warning');
        return;
      }
      await Api.apiClient.post('/api/customer/rentals', payload);
      UI.toast('Rental solicitado', 'success');
      rentalModal.hide();
      UI.qs('#rentalForm').reset();
    });

    loadAvailableTools();
  </script>
</body>
</html>

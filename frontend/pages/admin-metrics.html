<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Admin Métricas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="admin" data-section="metrics"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Métricas" data-subtitle="Visión global de negocio"></div>

      <section class="rt-grid rt-grid-3">
        <div class="rt-card rt-kpi">
          <span>Ingreso total</span>
          <strong id="totalIncome">-</strong>
        </div>
        <div class="rt-card">
          <h4>Top Tools</h4>
          <div id="topTools" class="mt-2"></div>
        </div>
        <div class="rt-card">
          <h4>Rentabilidad</h4>
          <div id="profitability" class="mt-2"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['ADMIN']);

    async function loadMetrics() {
      const income = await Api.apiClient.get('/api/admin/metrics/income');
      UI.qs('#totalIncome').textContent = income.totalIncome ?? '-';

      const top = await Api.apiClient.get('/api/admin/metrics/top-tools');
      UI.qs('#topTools').innerHTML = top.map(t => `<div>Tool ${t.toolId} · ${t.total}</div>`).join('') || '<div class="rt-empty">Sin datos</div>';

      const prof = await Api.apiClient.get('/api/admin/metrics/profitability');
      UI.qs('#profitability').innerHTML = prof.map(t => `<div>Tool ${t.toolId} · ${t.totalIncome}</div>`).join('') || '<div class="rt-empty">Sin datos</div>';
    }

    loadMetrics();
  </script>
</body>
</html>

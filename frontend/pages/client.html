<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar">
      <div class="rt-brand">RentTools Cliente</div>
      <nav class="rt-nav">
        <a href="#explore" class="active">Explorar</a>
        <a href="#rent">Reservar</a>
        <a href="#history">Historial</a>
      </nav>
    </aside>
    <main class="rt-main">
      <div class="rt-topbar">
        <div>
          <h2 class="mb-0">Panel Cliente</h2>
          <small class="text-muted">Encuentra y reserva herramientas</small>
        </div>
        <button class="rt-btn-secondary" id="logoutBtn">Cerrar sesión</button>
      </div>

      <section id="explore" class="rt-card mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Herramientas disponibles</h4>
          <div class="d-flex gap-2">
            <select class="rt-input" id="categoryFilter"></select>
            <button class="rt-btn-secondary" id="reloadAvailable">Recargar</button>
          </div>
        </div>
        <div id="availableTools" class="mt-3"></div>
      </section>

      <section id="rent" class="rt-card mb-4">
        <h4>Crear reserva</h4>
        <form id="rentalForm" class="mt-3">
          <div class="rt-grid rt-grid-2">
            <div class="rt-form-group">
              <label>Tool ID</label>
              <input class="rt-input" id="toolId" required>
            </div>
            <div class="rt-form-group">
              <label>Provider ID</label>
              <input class="rt-input" id="providerId" required>
            </div>
            <div class="rt-form-group">
              <label>Fecha inicio</label>
              <input class="rt-input" id="startDate" type="date" required>
            </div>
            <div class="rt-form-group">
              <label>Fecha fin</label>
              <input class="rt-input" id="endDate" type="date" required>
            </div>
            <div class="rt-form-group">
              <label>Total estimado</label>
              <input class="rt-input" id="totalAmount" type="number" step="0.01" required>
            </div>
          </div>
          <button class="rt-btn-primary" type="submit">Solicitar</button>
        </form>
      </section>

      <section id="history" class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Mis rentals</h4>
          <button class="rt-btn-secondary" id="reloadRentals">Recargar</button>
        </div>
        <div id="customerRentals" class="mt-3"></div>
      </section>
    </main>
  </div>
  <nav class="rt-bottom-nav">
    <a href="#explore">Explorar</a>
    <a href="#rent">Reservar</a>
    <a href="#history">Historial</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/validators.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script>
    Router.guard(['CUSTOMER']);
    document.getElementById('logoutBtn').addEventListener('click', () => Auth.logout());

    const availableTools = UI.qs('#availableTools');
    const categoryFilter = UI.qs('#categoryFilter');
    const customerRentals = UI.qs('#customerRentals');

    async function loadCategories() {
      const data = await Api.apiClient.get('/api/categories');
      categoryFilter.innerHTML = '<option value="">Todas</option>' + data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function loadAvailableTools() {
      const data = await Api.apiClient.get('/api/tools/available');
      const categoryId = categoryFilter.value;
      const filtered = categoryId ? data.filter(t => t.categoryId === categoryId) : data;
      if (!filtered.length) {
        availableTools.innerHTML = '<div class="rt-empty">Sin herramientas disponibles</div>';
        return;
      }
      availableTools.innerHTML = filtered.map(tool => `
        <div class="rt-card mb-2">
          <div class="d-flex justify-content-between">
            <div>
              <h5>${tool.name}</h5>
              <div class="text-muted">${tool.categoryName || ''}</div>
              <div>${tool.description || ''}</div>
            </div>
            <div>
              <div class="rt-pill">${tool.status}</div>
              <div class="mt-2">Hora: ${tool.hourlyRate ?? '-'} | Día: ${tool.dailyRate ?? '-'}</div>
            </div>
          </div>
          <div class="mt-2">
            <small>ID: ${tool.id}</small>
          </div>
        </div>
      `).join('');
    }

    function calculateTotal(start, end, tool) {
      if (!start || !end || !tool) return '';
      const s = new Date(start);
      const e = new Date(end);
      const days = Math.max(1, Math.ceil((e - s) / (1000 * 60 * 60 * 24)) + 1);
      if (tool.dailyRate) return (days * tool.dailyRate).toFixed(2);
      if (tool.hourlyRate) return (days * 8 * tool.hourlyRate).toFixed(2);
      return '';
    }

    async function loadRentals() {
      const data = await Api.apiClient.get('/api/customer/rentals');
      UI.renderTable({
        container: customerRentals,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'toolId', label: 'Tool' },
          { key: 'status', label: 'Estado' },
          { key: 'totalAmount', label: 'Total' },
          { key: 'createdAt', label: 'Creado', render: row => UI.formatDate(row.createdAt) },
          { key: 'actions', label: 'Acciones', render: row => `
            <button class="btn btn-sm btn-outline-primary" data-pay="${row.id}">Pagar</button>
            <button class="btn btn-sm btn-outline-secondary" data-invoice="${row.id}">Factura</button>` }
        ],
        data,
        pageSize: 6
      });

      UI.qsa('[data-pay]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-pay');
          const method = prompt('Método de pago');
          if (!method) return;
          await Api.apiClient.post(`/api/customer/rentals/${id}/pay`, { method });
          UI.toast('Pago registrado', 'success');
          loadRentals();
        });
      });

      UI.qsa('[data-invoice]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-invoice');
          const blob = await Api.apiClient.get(`/api/rentals/${id}/invoice`, { responseType: 'blob' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `invoice-${id}.pdf`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });
    }

    UI.qs('#rentalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        toolId: UI.qs('#toolId').value.trim(),
        providerId: UI.qs('#providerId').value.trim(),
        startDate: UI.qs('#startDate').value,
        endDate: UI.qs('#endDate').value,
        totalAmount: Number(UI.qs('#totalAmount').value)
      };
      if (!Validators.dateRange(payload.startDate, payload.endDate)) {
        UI.toast('Rango de fechas inválido', 'warning');
        return;
      }
      await Api.apiClient.post('/api/customer/rentals', payload);
      UI.toast('Rental solicitado', 'success');
      e.target.reset();
      loadRentals();
    });

    categoryFilter.addEventListener('change', loadAvailableTools);
    UI.qs('#reloadAvailable').addEventListener('click', loadAvailableTools);
    UI.qs('#reloadRentals').addEventListener('click', loadRentals);

    loadCategories();
    loadAvailableTools();
    loadRentals();
  </script>
</body>
</html>

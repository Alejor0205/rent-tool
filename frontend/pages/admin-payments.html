<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Admin Payments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="admin" data-section="payments"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Payments" data-subtitle="Pagos globales"></div>

      <section class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Payments</h4>
          <button class="rt-btn-secondary" id="reloadPayments">Recargar</button>
        </div>
        <div id="paymentsTable" class="mt-3"></div>
      </section>
    </main>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['ADMIN']);
    const paymentsTable = UI.qs('#paymentsTable');

    async function loadPayments() {
      const data = await Api.apiClient.get('/api/admin/payments');
      UI.renderTable({
        container: paymentsTable,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'rentalId', label: 'Rental' },
          { key: 'amount', label: 'Monto' },
          { key: 'status', label: 'Estado' },
          { key: 'method', label: 'Método' },
          { key: 'createdAt', label: 'Creado', render: row => UI.formatDate(row.createdAt) }
        ],
        data,
        pageSize: 8
      });
    }

    UI.qs('#reloadPayments').addEventListener('click', loadPayments);
    loadPayments();
  </script>
</body>
</html>

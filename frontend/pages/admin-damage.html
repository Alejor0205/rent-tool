<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Admin Daños</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="admin" data-section="damage"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Damage Reports" data-subtitle="Incidencias por daño"></div>

      <section class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Damage Reports</h4>
          <button class="rt-btn-secondary" id="reloadDamage">Recargar</button>
        </div>
        <div id="damageTable" class="mt-3"></div>
      </section>
    </main>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['ADMIN']);
    const damageTable = UI.qs('#damageTable');

    async function loadDamageReports() {
      const data = await Api.apiClient.get('/api/admin/damage-reports');
      UI.renderTable({
        container: damageTable,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'toolId', label: 'Tool' },
          { key: 'description', label: 'Descripción' },
          { key: 'resolved', label: 'Resuelto', render: row => row.resolved ? '<span class="rt-pill success">Sí</span>' : '<span class="rt-pill danger">No</span>' },
          { key: 'actions', label: 'Acciones', render: row => row.resolved ? '-' : `<button class=\"btn btn-sm btn-outline-primary\" data-resolve=\"${row.id}\">Resolver</button>` }
        ],
        data,
        pageSize: 8
      });

      UI.qsa('[data-resolve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-resolve');
          await Api.apiClient.patch(`/api/admin/damage-reports/${id}/resolve`, {});
          UI.toast('Reporte resuelto', 'success');
          loadDamageReports();
        });
      });
    }

    UI.qs('#reloadDamage').addEventListener('click', loadDamageReports);
    loadDamageReports();
  </script>
</body>
</html>

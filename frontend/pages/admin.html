<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar">
      <div class="rt-brand">RentTools Admin</div>
      <nav class="rt-nav">
        <a href="#users" class="active">Usuarios</a>
        <a href="#rentals">Rentals</a>
        <a href="#payments">Payments</a>
        <a href="#damage">Daños</a>
        <a href="#metrics">Métricas</a>
      </nav>
    </aside>
    <main class="rt-main">
      <div class="rt-topbar">
        <div>
          <h2 class="mb-0">Panel Admin</h2>
          <small class="text-muted">Control operativo y métricas globales</small>
        </div>
        <button class="rt-btn-secondary" id="logoutBtn">Cerrar sesión</button>
      </div>

      <section id="users" class="rt-grid mb-4">
        <div class="rt-card">
          <h4>Crear usuario</h4>
          <form id="createUserForm" class="mt-3">
            <div class="rt-grid rt-grid-2">
              <div class="rt-form-group">
                <label>Nombre completo</label>
                <input class="rt-input" id="userFullName" required>
              </div>
              <div class="rt-form-group">
                <label>Email</label>
                <input class="rt-input" id="userEmail" type="email" required>
              </div>
              <div class="rt-form-group">
                <label>Teléfono</label>
                <input class="rt-input" id="userPhone" required>
              </div>
              <div class="rt-form-group">
                <label>Rol</label>
                <select class="rt-input" id="userRole" required>
                  <option value="ADMIN">ADMIN</option>
                  <option value="PROVIDER">PROVIDER</option>
                  <option value="CUSTOMER">CUSTOMER</option>
                </select>
              </div>
            </div>
            <button class="rt-btn-primary" type="submit">Crear</button>
          </form>
        </div>
        <div class="rt-card">
          <div class="d-flex justify-content-between align-items-center">
            <h4>Usuarios</h4>
            <input class="rt-input" id="userSearch" placeholder="Buscar por nombre o email" style="max-width: 240px;" />
          </div>
          <div id="usersTable" class="mt-3"></div>
        </div>
      </section>

      <section id="rentals" class="rt-card mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Rentals</h4>
          <button class="rt-btn-secondary" id="reloadRentals">Recargar</button>
        </div>
        <div id="rentalsTable" class="mt-3"></div>
      </section>

      <section id="payments" class="rt-card mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Payments</h4>
          <button class="rt-btn-secondary" id="reloadPayments">Recargar</button>
        </div>
        <div id="paymentsTable" class="mt-3"></div>
      </section>

      <section id="damage" class="rt-card mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Damage Reports</h4>
          <button class="rt-btn-secondary" id="reloadDamage">Recargar</button>
        </div>
        <div id="damageTable" class="mt-3"></div>
      </section>

      <section id="metrics" class="rt-grid rt-grid-3 mb-4">
        <div class="rt-card rt-kpi">
          <span>Ingreso total</span>
          <strong id="totalIncome">-</strong>
        </div>
        <div class="rt-card">
          <h4>Top Tools</h4>
          <div id="topTools" class="mt-2"></div>
        </div>
        <div class="rt-card">
          <h4>Rentabilidad</h4>
          <div id="profitability" class="mt-2"></div>
        </div>
      </section>
    </main>
  </div>
  <nav class="rt-bottom-nav">
    <a href="#users">Usuarios</a>
    <a href="#rentals">Rentals</a>
    <a href="#payments">Payments</a>
    <a href="#damage">Daños</a>
    <a href="#metrics">Métricas</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/validators.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script>
    Router.guard(['ADMIN']);

    const usersTable = UI.qs('#usersTable');
    const rentalsTable = UI.qs('#rentalsTable');
    const paymentsTable = UI.qs('#paymentsTable');
    const damageTable = UI.qs('#damageTable');

    document.getElementById('logoutBtn').addEventListener('click', () => Auth.logout());

    async function loadUsers() {
      const data = await Api.apiClient.get('/api/admin/users');
      const query = UI.qs('#userSearch').value.trim().toLowerCase();
      const filtered = data.filter(u => !query || u.fullName.toLowerCase().includes(query) || u.email.toLowerCase().includes(query));
      UI.renderTable({
        container: usersTable,
        columns: [
          { key: 'fullName', label: 'Nombre' },
          { key: 'email', label: 'Email' },
          { key: 'phone', label: 'Teléfono' },
          { key: 'role', label: 'Rol' },
          { key: 'actions', label: 'Acciones', render: (row) => `
            <button class="btn btn-sm btn-outline-secondary" data-edit="${row.id}">Editar</button>
            <button class="btn btn-sm btn-outline-danger" data-del="${row.id}">Eliminar</button>` }
        ],
        data: filtered,
        pageSize: 6
      });

      UI.qsa('[data-edit]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-edit');
          const fullName = prompt('Nombre completo');
          const phone = prompt('Teléfono');
          const role = prompt('Rol (ADMIN/PROVIDER/CUSTOMER)');
          if (!fullName || !phone || !role) return;
          await Api.apiClient.put(`/api/admin/users/${id}`, { fullName, phone, role });
          UI.toast('Usuario actualizado', 'success');
          loadUsers();
        });
      });

      UI.qsa('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-del');
          if (!confirm('¿Eliminar usuario?')) return;
          await Api.apiClient.delete(`/api/admin/users/${id}`);
          UI.toast('Usuario eliminado', 'success');
          loadUsers();
        });
      });
    }

    async function loadRentals() {
      const data = await Api.apiClient.get('/api/admin/rentals');
      UI.renderTable({
        container: rentalsTable,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'toolId', label: 'Tool' },
          { key: 'customerId', label: 'Cliente' },
          { key: 'providerId', label: 'Proveedor' },
          { key: 'status', label: 'Estado' },
          { key: 'totalAmount', label: 'Total' },
          { key: 'createdAt', label: 'Creado', render: row => UI.formatDate(row.createdAt) }
        ],
        data,
        pageSize: 6
      });
    }

    async function loadPayments() {
      const data = await Api.apiClient.get('/api/admin/payments');
      UI.renderTable({
        container: paymentsTable,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'rentalId', label: 'Rental' },
          { key: 'amount', label: 'Monto' },
          { key: 'status', label: 'Estado' },
          { key: 'method', label: 'Método' },
          { key: 'createdAt', label: 'Creado', render: row => UI.formatDate(row.createdAt) }
        ],
        data,
        pageSize: 6
      });
    }

    async function loadDamageReports() {
      const data = await Api.apiClient.get('/api/admin/damage-reports');
      UI.renderTable({
        container: damageTable,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'toolId', label: 'Tool' },
          { key: 'description', label: 'Descripción' },
          { key: 'resolved', label: 'Resuelto', render: row => row.resolved ? '<span class="rt-pill success">Sí</span>' : '<span class="rt-pill danger">No</span>' },
          { key: 'actions', label: 'Acciones', render: row => row.resolved ? '-' : `<button class="btn btn-sm btn-outline-primary" data-resolve="${row.id}">Resolver</button>` }
        ],
        data,
        pageSize: 6
      });

      UI.qsa('[data-resolve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-resolve');
          await Api.apiClient.patch(`/api/admin/damage-reports/${id}/resolve`, {});
          UI.toast('Reporte resuelto', 'success');
          loadDamageReports();
        });
      });
    }

    async function loadMetrics() {
      const income = await Api.apiClient.get('/api/admin/metrics/income');
      UI.qs('#totalIncome').textContent = income.totalIncome ?? '-';

      const top = await Api.apiClient.get('/api/admin/metrics/top-tools');
      UI.qs('#topTools').innerHTML = top.map(t => `<div>Tool ${t.toolId} · ${t.total}</div>`).join('') || '<div class="rt-empty">Sin datos</div>';

      const prof = await Api.apiClient.get('/api/admin/metrics/profitability');
      UI.qs('#profitability').innerHTML = prof.map(t => `<div>Tool ${t.toolId} · ${t.totalIncome}</div>`).join('') || '<div class="rt-empty">Sin datos</div>';
    }

    UI.qs('#createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: UI.qs('#userFullName').value.trim(),
        email: UI.qs('#userEmail').value.trim(),
        phone: UI.qs('#userPhone').value.trim(),
        role: UI.qs('#userRole').value
      };
      await Api.apiClient.post('/api/admin/users', payload);
      UI.toast('Usuario creado', 'success');
      e.target.reset();
      loadUsers();
    });

    UI.qs('#userSearch').addEventListener('input', loadUsers);
    UI.qs('#reloadRentals').addEventListener('click', loadRentals);
    UI.qs('#reloadPayments').addEventListener('click', loadPayments);
    UI.qs('#reloadDamage').addEventListener('click', loadDamageReports);

    loadUsers();
    loadRentals();
    loadPayments();
    loadDamageReports();
    loadMetrics();
  </script>
</body>
</html>

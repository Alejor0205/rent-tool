<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Cliente Historial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="customer" data-section="history"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Historial" data-subtitle="Tus alquileres"></div>

      <section class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Mis rentals</h4>
          <button class="rt-btn-secondary" id="reloadRentals">Recargar</button>
        </div>
        <div id="customerRentals" class="mt-3"></div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="payModal" tabindex="-1" aria-labelledby="payLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="payLabel">Pagar rental</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="payForm">
            <input type="hidden" id="payRentalId">
            <div class="rt-form-group">
              <label>Método de pago</label>
              <input class="rt-input" id="payMethod" required placeholder="Ej: tarjeta, transferencia">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="rt-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="rt-btn-primary" id="confirmPay">Pagar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['CUSTOMER']);

    const customerRentals = UI.qs('#customerRentals');
    const payModal = new bootstrap.Modal(document.getElementById('payModal'));

    async function loadRentals() {
      const data = await Api.apiClient.get('/api/customer/rentals');
      UI.renderTable({
        container: customerRentals,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'toolId', label: 'Tool' },
          { key: 'status', label: 'Estado' },
          { key: 'totalAmount', label: 'Total' },
          { key: 'createdAt', label: 'Creado', render: row => UI.formatDate(row.createdAt) },
          { key: 'actions', label: 'Acciones', render: row => `
            <button class=\"btn btn-sm btn-outline-primary\" data-pay=\"${row.id}\">Pagar</button>
            <button class=\"btn btn-sm btn-outline-secondary\" data-invoice=\"${row.id}\">Factura</button>` }
        ],
        data,
        pageSize: 8
      });

      UI.qsa('[data-pay]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-pay');
          UI.qs('#payRentalId').value = id;
          UI.qs('#payMethod').value = '';
          payModal.show();
        });
      });

      UI.qsa('[data-invoice]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-invoice');
          const blob = await Api.apiClient.get(`/api/rentals/${id}/invoice`, { responseType: 'blob' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `invoice-${id}.pdf`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });
    }

    UI.qs('#confirmPay').addEventListener('click', async () => {
      const id = UI.qs('#payRentalId').value.trim();
      const method = UI.qs('#payMethod').value.trim();
      if (!method) {
        UI.toast('Ingresa un método de pago.', 'warning');
        return;
      }
      await Api.apiClient.post(`/api/customer/rentals/${id}/pay`, { method });
      UI.toast('Pago registrado', 'success');
      payModal.hide();
      loadRentals();
    });

    UI.qs('#reloadRentals').addEventListener('click', loadRentals);
    loadRentals();
  </script>
</body>
</html>

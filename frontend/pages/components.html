<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Componentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1>Componentes</h1>
    <div class="rt-grid rt-grid-3 mt-4">
      <div class="rt-card rt-kpi">
        <span>Total ingresos</span>
        <strong>$12,450</strong>
      </div>
      <div class="rt-card">
        <h4>Estado</h4>
        <span class="rt-pill">AVAILABLE</span>
        <span class="rt-pill success">PAID</span>
        <span class="rt-pill danger">FAILED</span>
      </div>
      <div class="rt-card">
        <h4>Loader</h4>
        <div class="rt-loader"></div>
      </div>
    </div>

    <div class="rt-card mt-4">
      <h4>Tabla con paginación</h4>
      <div id="tableDemo" class="mt-3"></div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script>
    UI.renderTable({
      container: document.getElementById('tableDemo'),
      columns: [
        { key: 'name', label: 'Nombre' },
        { key: 'status', label: 'Estado' },
        { key: 'amount', label: 'Monto' }
      ],
      data: [
        { name: 'Taladro', status: 'AVAILABLE', amount: 50 },
        { name: 'Martillo', status: 'RENTED', amount: 20 },
        { name: 'Sierra', status: 'MAINTENANCE', amount: 65 }
      ],
      pageSize: 2
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/frontend/assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="rt-card">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h2 class="mb-1">RentTools</h2>
              <p class="text-muted">Accede a la plataforma de alquiler de herramientas.</p>
            </div>
            <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#baseUrlPanel" aria-expanded="false">Base URL</button>
          </div>
          <div class="collapse mt-3" id="baseUrlPanel">
            <div class="rt-form-group">
              <label for="baseUrl">Base URL API</label>
              <input id="baseUrl" class="rt-input" placeholder="http://localhost:8080" />
            </div>
            <button id="saveBaseUrl" class="rt-btn-secondary">Guardar</button>
          </div>

          <ul class="nav nav-tabs mt-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registro</button>
            </li>
          </ul>
          <div class="tab-content pt-4">
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <form id="loginForm">
                <div class="rt-form-group">
                  <label for="loginEmail">Email</label>
                  <input id="loginEmail" class="rt-input" type="email" required>
                </div>
                <div class="rt-form-group">
                  <label for="loginPassword">Password</label>
                  <input id="loginPassword" class="rt-input" type="password" required>
                </div>
                <button class="rt-btn-primary w-100" type="submit">Ingresar</button>
              </form>
            </div>
            <div class="tab-pane fade" id="register" role="tabpanel">
              <form id="registerForm">
                <div class="rt-form-group">
                  <label for="regName">Nombre completo</label>
                  <input id="regName" class="rt-input" required>
                </div>
                <div class="rt-form-group">
                  <label for="regEmail">Email</label>
                  <input id="regEmail" class="rt-input" type="email" required>
                </div>
                <div class="rt-form-group">
                  <label for="regPhone">Teléfono</label>
                  <input id="regPhone" class="rt-input" required>
                </div>
                <div class="rt-form-group">
                  <label for="regPassword">Password</label>
                  <input id="regPassword" class="rt-input" type="password" required>
                </div>
                <button class="rt-btn-primary w-100" type="submit">Crear cuenta</button>
              </form>
            </div>
          </div>
          <div class="mt-4 rt-alert" aria-live="polite">
            Roles soportados por OpenAPI: ADMIN, PROVIDER, CUSTOMER.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/assets/js/api.js"></script>
  <script src="/frontend/assets/js/ui.js"></script>
  <script src="/frontend/assets/js/validators.js"></script>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/router.js"></script>
  <script>
    const baseUrlInput = UI.qs('#baseUrl');
    baseUrlInput.value = Api.getBaseUrl();
    UI.qs('#saveBaseUrl').addEventListener('click', () => {
      Api.setBaseUrl(baseUrlInput.value.trim());
      UI.toast('Base URL guardada', 'success');
    });

    UI.qs('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = UI.qs('#loginEmail').value.trim();
      const password = UI.qs('#loginPassword').value.trim();
      if (!Validators.email(email) || !Validators.required(password)) {
        UI.toast('Completa email y password válidos.', 'warning');
        return;
      }
      try {
        const data = await Auth.login({ email, password });
        window.location.href = Router.routeFromRole(data.role);
      } catch (err) {
        UI.toast('Login fallido', 'danger');
      }
    });

    UI.qs('#registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: UI.qs('#regName').value.trim(),
        email: UI.qs('#regEmail').value.trim(),
        phone: UI.qs('#regPhone').value.trim(),
        password: UI.qs('#regPassword').value.trim()
      };
      if (!payload.fullName || !Validators.email(payload.email) || !payload.phone || !payload.password) {
        UI.toast('Completa todos los campos.', 'warning');
        return;
      }
      try {
        const data = await Auth.register(payload);
        window.location.href = Router.routeFromRole(data.role);
      } catch (err) {
        UI.toast('Registro fallido', 'danger');
      }
    });
  </script>
</body>
</html>

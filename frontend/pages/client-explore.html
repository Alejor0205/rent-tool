<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Cliente Explorar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="customer" data-section="explore"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Explorar" data-subtitle="Herramientas disponibles"></div>

      <section class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Herramientas disponibles</h4>
          <div class="d-flex gap-2">
            <select class="rt-input" id="categoryFilter"></select>
            <button class="rt-btn-secondary" id="reloadAvailable">Recargar</button>
          </div>
        </div>
        <div id="availableTools" class="mt-3"></div>
      </section>
    </main>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['CUSTOMER']);

    const availableTools = UI.qs('#availableTools');
    const categoryFilter = UI.qs('#categoryFilter');

    async function loadCategories() {
      const data = await Api.apiClient.get('/api/categories');
      categoryFilter.innerHTML = '<option value="">Todas</option>' + data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function loadAvailableTools() {
      const data = await Api.apiClient.get('/api/tools/available');
      const categoryId = categoryFilter.value;
      const filtered = categoryId ? data.filter(t => t.categoryId === categoryId) : data;
      if (!filtered.length) {
        availableTools.innerHTML = '<div class="rt-empty">Sin herramientas disponibles</div>';
        return;
      }
      availableTools.innerHTML = filtered.map(tool => `
        <div class=\"rt-card mb-2\">
          <div class=\"d-flex justify-content-between\">
            <div>
              <h5>${tool.name}</h5>
              <div class=\"text-muted\">${tool.categoryName || ''}</div>
              <div>${tool.description || ''}</div>
            </div>
            <div>
              <div class=\"rt-pill\">${tool.status}</div>
              <div class=\"mt-2\">Hora: ${tool.hourlyRate ?? '-'} | Día: ${tool.dailyRate ?? '-'}</div>
              <a class=\"btn btn-sm btn-outline-light mt-2\" href=\"tool-detail.html?id=${tool.id}\">Ver detalle</a>
            </div>
          </div>
          <div class=\"mt-2\">
            <small>ID: ${tool.id}</small>
          </div>
        </div>
      `).join('');
    }

    categoryFilter.addEventListener('change', loadAvailableTools);
    UI.qs('#reloadAvailable').addEventListener('click', loadAvailableTools);

    loadCategories();
    loadAvailableTools();
  </script>
</body>
</html>

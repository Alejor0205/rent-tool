<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Admin Rentals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="admin" data-section="rentals"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Rentals" data-subtitle="Historial global de alquileres"></div>

      <section class="rt-card">
        <div class="d-flex justify-content-between align-items-center">
          <h4>Rentals</h4>
          <button class="rt-btn-secondary" id="reloadRentals">Recargar</button>
        </div>
        <div id="rentalsTable" class="mt-3"></div>
      </section>
    </main>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['ADMIN']);
    const rentalsTable = UI.qs('#rentalsTable');

    async function loadRentals() {
      const data = await Api.apiClient.get('/api/admin/rentals');
      UI.renderTable({
        container: rentalsTable,
        columns: [
          { key: 'id', label: 'ID' },
          { key: 'toolId', label: 'Tool' },
          { key: 'customerId', label: 'Cliente' },
          { key: 'providerId', label: 'Proveedor' },
          { key: 'status', label: 'Estado' },
          { key: 'totalAmount', label: 'Total' },
          { key: 'createdAt', label: 'Creado', render: row => UI.formatDate(row.createdAt) }
        ],
        data,
        pageSize: 8
      });
    }

    UI.qs('#reloadRentals').addEventListener('click', loadRentals);
    loadRentals();
  </script>
</body>
</html>

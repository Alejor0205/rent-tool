<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Tool Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="rt-topbar">
      <div>
        <h2 class="mb-0">Detalle de herramienta</h2>
        <small class="text-muted">Información completa</small>
      </div>
      <a class="rt-btn-secondary" href="javascript:history.back()">Volver</a>
    </div>

    <div class="rt-card">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="rt-card" style="min-height: 280px; display:flex; align-items:center; justify-content:center;">
            <img id="toolImage" alt="Imagen herramienta" style="max-width:100%; max-height:260px; display:none;" />
            <div id="imagePlaceholder" class="rt-empty">Sin imagen</div>
          </div>
        </div>
        <div class="col-lg-7">
          <h3 id="toolName">-</h3>
          <p id="toolDescription" class="text-muted">-</p>
          <div class="rt-grid rt-grid-2">
            <div class="rt-card">
              <span class="text-muted">Categoría</span>
              <div id="toolCategory">-</div>
            </div>
            <div class="rt-card">
              <span class="text-muted">Estado</span>
              <div id="toolStatus">-</div>
            </div>
            <div class="rt-card">
              <span class="text-muted">Tarifa por hora</span>
              <div id="toolHourly">-</div>
            </div>
            <div class="rt-card">
              <span class="text-muted">Tarifa por día</span>
              <div id="toolDaily">-</div>
            </div>
          </div>
          <div class="mt-3 text-muted"><small id="toolId">-</small></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script>
    Router.guard(['ADMIN', 'PROVIDER', 'CUSTOMER']);
    const params = new URLSearchParams(window.location.search);
    const toolId = params.get('id');
    if (!toolId) {
      UI.toast('Tool ID faltante', 'warning');
    }

    async function loadTool() {
      const tool = await Api.apiClient.get(`/api/tools/${toolId}`);
      UI.qs('#toolName').textContent = tool.name || '-';
      UI.qs('#toolDescription').textContent = tool.description || '-';
      UI.qs('#toolCategory').textContent = tool.categoryName || tool.categoryId || '-';
      UI.qs('#toolStatus').textContent = tool.status || '-';
      UI.qs('#toolHourly').textContent = tool.hourlyRate ?? '-';
      UI.qs('#toolDaily').textContent = tool.dailyRate ?? '-';
      UI.qs('#toolId').textContent = `ID: ${tool.id}`;

      try {
        const blob = await Api.apiClient.get(`/api/tools/${toolId}/image`, { responseType: 'blob', accept: '*/*' });
        if (blob && blob.size > 0) {
          const url = URL.createObjectURL(blob);
          const img = UI.qs('#toolImage');
          img.src = url;
          img.style.display = 'block';
          UI.qs('#imagePlaceholder').style.display = 'none';
        }
      } catch (err) {
        // no image available
      }
    }

    loadTool();
  </script>
</body>
</html>

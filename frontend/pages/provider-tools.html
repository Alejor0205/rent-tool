<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Provider Herramientas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="provider" data-section="tools"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Herramientas" data-subtitle="Inventario y publicaciones"></div>

      <section class="rt-grid rt-grid-2">
        <div class="rt-card">
          <h4>Crear herramienta</h4>
          <form id="toolForm" class="mt-3">
            <div class="rt-form-group">
              <label>Nombre</label>
              <input class="rt-input" id="toolName" required>
            </div>
            <div class="rt-form-group">
              <label>Categoría</label>
              <select class="rt-input" id="toolCategory"></select>
            </div>
            <div class="rt-grid rt-grid-2">
              <div class="rt-form-group">
                <label>Tarifa por hora</label>
                <input class="rt-input" id="toolHourly" type="number" step="0.01">
              </div>
              <div class="rt-form-group">
                <label>Tarifa por día</label>
                <input class="rt-input" id="toolDaily" type="number" step="0.01">
              </div>
            </div>
            <div class="rt-form-group">
              <label>Descripción</label>
              <textarea class="rt-input" id="toolDescription" rows="2"></textarea>
            </div>
            <button class="rt-btn-primary" type="submit">Crear</button>
          </form>

          <div class="mt-4">
            <h5>Imagen</h5>
            <div class="rt-alert">Sube una imagen por herramienta seleccionada (editar).</div>
            <form id="imageForm" class="mt-2">
              <input type="file" id="toolImage" class="rt-input" accept="image/*" />
              <button class="rt-btn-secondary mt-2" type="submit">Subir imagen</button>
            </form>
          </div>
        </div>

        <div class="rt-card">
          <div class="d-flex justify-content-between align-items-center">
            <h4>Inventario</h4>
            <button class="rt-btn-secondary" id="reloadTools">Recargar</button>
          </div>
          <div id="toolsTable" class="mt-3"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="editToolModal" tabindex="-1" aria-labelledby="editToolLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editToolLabel">Editar herramienta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="editToolForm">
            <input type="hidden" id="editToolId">
            <div class="rt-form-group">
              <label>Nombre</label>
              <input class="rt-input" id="editToolName" required>
            </div>
            <div class="rt-form-group">
              <label>Categoría</label>
              <select class="rt-input" id="editToolCategory"></select>
            </div>
            <div class="rt-grid rt-grid-2">
              <div class="rt-form-group">
                <label>Tarifa por hora</label>
                <input class="rt-input" id="editToolHourly" type="number" step="0.01">
              </div>
              <div class="rt-form-group">
                <label>Tarifa por día</label>
                <input class="rt-input" id="editToolDaily" type="number" step="0.01">
              </div>
            </div>
            <div class="rt-form-group">
              <label>Descripción</label>
              <textarea class="rt-input" id="editToolDescription" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="rt-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="rt-btn-primary" id="saveToolChanges">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="statusLabel">Cambiar estado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="statusToolId">
          <div class="rt-form-group">
            <label>Estado</label>
            <select class="rt-input" id="statusValue">
              <option value="AVAILABLE">AVAILABLE</option>
              <option value="RENTED">RENTED</option>
              <option value="RETURNING">RETURNING</option>
              <option value="MAINTENANCE">MAINTENANCE</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="rt-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="rt-btn-primary" id="saveStatus">Actualizar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['PROVIDER']);

    const toolsTable = UI.qs('#toolsTable');
    const toolForm = UI.qs('#toolForm');
    const toolCategory = UI.qs('#toolCategory');
    const editModal = new bootstrap.Modal(document.getElementById('editToolModal'));
    const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));

    async function loadCategories() {
      const categories = await Api.apiClient.get('/api/categories');
      toolCategory.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      UI.qs('#editToolCategory').innerHTML = toolCategory.innerHTML;
    }

    async function loadTools() {
      const data = await Api.apiClient.get('/api/tools');
      UI.renderTable({
        container: toolsTable,
        columns: [
          { key: 'name', label: 'Nombre' },
          { key: 'categoryName', label: 'Categoría' },
          { key: 'hourlyRate', label: 'Hora' },
          { key: 'dailyRate', label: 'Día' },
          { key: 'status', label: 'Estado' },
          { key: 'actions', label: 'Acciones', render: row => `
            <button class=\"btn btn-sm btn-outline-secondary\" data-edit=\"${row.id}\">Editar</button>
            <button class=\"btn btn-sm btn-outline-primary\" data-status=\"${row.id}\">Estado</button>
            <a class=\"btn btn-sm btn-outline-light\" href=\"tool-detail.html?id=${row.id}\">Ver</a>
            <button class=\"btn btn-sm btn-outline-danger\" data-del=\"${row.id}\">Eliminar</button>` }
        ],
        data,
        pageSize: 8
      });

      UI.qsa('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = data.find(t => t.id === btn.getAttribute('data-edit'));
          if (!row) return;
          UI.qs('#editToolId').value = row.id;
          UI.qs('#editToolName').value = row.name || '';
          UI.qs('#editToolDescription').value = row.description || '';
          UI.qs('#editToolCategory').value = row.categoryId;
          UI.qs('#editToolHourly').value = row.hourlyRate || '';
          UI.qs('#editToolDaily').value = row.dailyRate || '';
          editModal.show();
        });
      });

      UI.qsa('[data-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = data.find(t => t.id === btn.getAttribute('data-status'));
          if (!row) return;
          UI.qs('#statusToolId').value = row.id;
          UI.qs('#statusValue').value = row.status || 'AVAILABLE';
          statusModal.show();
        });
      });

      UI.qsa('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-del');
          if (!confirm('¿Eliminar herramienta?')) return;
          await Api.apiClient.delete(`/api/tools/${id}`);
          UI.toast('Herramienta eliminada', 'success');
          loadTools();
        });
      });
    }

    toolForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: UI.qs('#toolName').value.trim(),
        categoryId: toolCategory.value,
        hourlyRate: Number(UI.qs('#toolHourly').value) || 0,
        dailyRate: Number(UI.qs('#toolDaily').value) || 0,
        description: UI.qs('#toolDescription').value.trim()
      };
      if (!payload.name || !payload.categoryId) {
        UI.toast('Nombre y categoría son obligatorios', 'warning');
        return;
      }
      await Api.apiClient.post('/api/tools', payload);
      UI.toast('Herramienta creada', 'success');
      toolForm.reset();
      loadTools();
    });

    UI.qs('#saveToolChanges').addEventListener('click', async () => {
      const id = UI.qs('#editToolId').value.trim();
      const payload = {
        name: UI.qs('#editToolName').value.trim(),
        categoryId: UI.qs('#editToolCategory').value,
        hourlyRate: Number(UI.qs('#editToolHourly').value) || 0,
        dailyRate: Number(UI.qs('#editToolDaily').value) || 0,
        description: UI.qs('#editToolDescription').value.trim()
      };
      if (!payload.name || !payload.categoryId) {
        UI.toast('Nombre y categoría son obligatorios', 'warning');
        return;
      }
      await Api.apiClient.put(`/api/tools/${id}`, payload);
      UI.toast('Herramienta actualizada', 'success');
      editModal.hide();
      loadTools();
    });

    UI.qs('#saveStatus').addEventListener('click', async () => {
      const id = UI.qs('#statusToolId').value.trim();
      const status = UI.qs('#statusValue').value;
      await Api.apiClient.patch(`/api/tools/${id}/status`, { status });
      UI.toast('Estado actualizado', 'success');
      statusModal.hide();
      loadTools();
    });

    UI.qs('#reloadTools').addEventListener('click', loadTools);

    UI.qs('#imageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const selectedId = UI.qs('#editToolId').value.trim();
      if (!selectedId) {
        UI.toast('Selecciona una herramienta a editar para subir imagen.', 'warning');
        return;
      }
      const file = UI.qs('#toolImage').files[0];
      if (!file) {
        UI.toast('Selecciona un archivo', 'warning');
        return;
      }
      const fd = new FormData();
      fd.append('file', file);
      await Api.apiClient.post(`/api/tools/${selectedId}/image`, fd);
      UI.toast('Imagen subida', 'success');
    });

    loadCategories();
    loadTools();
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Admin Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="admin" data-section="users"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Usuarios" data-subtitle="Gestión de usuarios"></div>

      <section class="rt-grid">
        <div class="rt-card">
          <h4>Crear usuario</h4>
          <form id="createUserForm" class="mt-3">
            <div class="rt-grid rt-grid-2">
              <div class="rt-form-group">
                <label>Nombre completo</label>
                <input class="rt-input" id="userFullName" required>
              </div>
              <div class="rt-form-group">
                <label>Email</label>
                <input class="rt-input" id="userEmail" type="email" required>
              </div>
              <div class="rt-form-group">
                <label>Teléfono</label>
                <input class="rt-input" id="userPhone" required>
              </div>
              <div class="rt-form-group">
                <label>Rol</label>
                <select class="rt-input" id="userRole" required>
                  <option value="ADMIN">ADMIN</option>
                  <option value="PROVIDER">PROVIDER</option>
                  <option value="CUSTOMER">CUSTOMER</option>
                </select>
              </div>
            </div>
            <button class="rt-btn-primary" type="submit">Crear</button>
          </form>
        </div>
        <div class="rt-card">
          <div class="d-flex justify-content-between align-items-center">
            <h4>Usuarios</h4>
            <input class="rt-input" id="userSearch" placeholder="Buscar por nombre o email" style="max-width: 240px;" />
          </div>
          <div id="usersTable" class="mt-3"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editUserLabel">Editar usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="editUserForm">
            <input type="hidden" id="editUserId">
            <div class="rt-form-group">
              <label>Nombre completo</label>
              <input class="rt-input" id="editFullName" required>
            </div>
            <div class="rt-form-group">
              <label>Teléfono</label>
              <input class="rt-input" id="editPhone" required>
            </div>
            <div class="rt-form-group">
              <label>Rol</label>
              <select class="rt-input" id="editRole" required>
                <option value="ADMIN">ADMIN</option>
                <option value="PROVIDER">PROVIDER</option>
                <option value="CUSTOMER">CUSTOMER</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="rt-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="rt-btn-primary" id="saveUserChanges">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/validators.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['ADMIN']);
    const usersTable = UI.qs('#usersTable');
    const editModal = new bootstrap.Modal(document.getElementById('editUserModal'));

    async function loadUsers() {
      const data = await Api.apiClient.get('/api/admin/users');
      const query = UI.qs('#userSearch').value.trim().toLowerCase();
      const filtered = data.filter(u => !query || u.fullName.toLowerCase().includes(query) || u.email.toLowerCase().includes(query));
      UI.renderTable({
        container: usersTable,
        columns: [
          { key: 'fullName', label: 'Nombre' },
          { key: 'email', label: 'Email' },
          { key: 'phone', label: 'Teléfono' },
          { key: 'role', label: 'Rol' },
          { key: 'actions', label: 'Acciones', render: (row) => `
            <button class=\"btn btn-sm btn-outline-secondary\" data-edit=\"${row.id}\">Editar</button>
            <button class=\"btn btn-sm btn-outline-danger\" data-del=\"${row.id}\">Eliminar</button>` }
        ],
        data: filtered,
        pageSize: 8
      });

      UI.qsa('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit');
          const user = data.find(u => u.id === id);
          if (!user) return;
          UI.qs('#editUserId').value = user.id;
          UI.qs('#editFullName').value = user.fullName || '';
          UI.qs('#editPhone').value = user.phone || '';
          UI.qs('#editRole').value = user.role || 'CUSTOMER';
          editModal.show();
        });
      });

      UI.qsa('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-del');
          if (!confirm('¿Eliminar usuario?')) return;
          await Api.apiClient.delete(`/api/admin/users/${id}`);
          UI.toast('Usuario eliminado', 'success');
          loadUsers();
        });
      });
    }

    UI.qs('#createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: UI.qs('#userFullName').value.trim(),
        email: UI.qs('#userEmail').value.trim(),
        phone: UI.qs('#userPhone').value.trim(),
        role: UI.qs('#userRole').value
      };
      await Api.apiClient.post('/api/admin/users', payload);
      UI.toast('Usuario creado', 'success');
      e.target.reset();
      loadUsers();
    });

    UI.qs('#saveUserChanges').addEventListener('click', async () => {
      const id = UI.qs('#editUserId').value.trim();
      const payload = {
        fullName: UI.qs('#editFullName').value.trim(),
        phone: UI.qs('#editPhone').value.trim(),
        role: UI.qs('#editRole').value
      };
      if (!payload.fullName || !payload.phone) {
        UI.toast('Completa nombre y teléfono.', 'warning');
        return;
      }
      await Api.apiClient.put(`/api/admin/users/${id}`, payload);
      UI.toast('Usuario actualizado', 'success');
      editModal.hide();
      loadUsers();
    });

    UI.qs('#userSearch').addEventListener('input', loadUsers);
    loadUsers();
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentTools | Provider Rentals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="rt-shell">
    <aside class="rt-sidebar" id="rt-sidebar" data-role="provider" data-section="rentals"></aside>
    <main class="rt-main">
      <div id="rt-topbar" data-title="Rentals" data-subtitle="Operación por ID"></div>

      <section class="rt-card">
        <div class="rt-alert">OpenAPI no expone listado de rentals para Provider. Puedes operar por ID directamente.</div>
        <form id="rentalActionForm" class="mt-3">
          <div class="rt-grid rt-grid-2">
            <div class="rt-form-group">
              <label>Rental ID</label>
              <input class="rt-input" id="rentalId" required>
            </div>
            <div class="rt-form-group">
              <label>Acción</label>
              <select class="rt-input" id="rentalAction">
                <option value="accept">Accept</option>
                <option value="reject">Reject</option>
                <option value="return">Return</option>
              </select>
            </div>
          </div>
          <button class="rt-btn-primary" type="submit">Continuar</button>
        </form>
      </section>
    </main>
  </div>

  <div class="modal fade" id="returnModal" tabindex="-1" aria-labelledby="returnLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="returnLabel">Confirmar devolución</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="returnForm">
            <input type="hidden" id="returnRentalId">
            <div class="rt-form-group">
              <label>¿Daños?</label>
              <select class="rt-input" id="damaged">
                <option value="false">No</option>
                <option value="true">Sí</option>
              </select>
            </div>
            <div class="rt-form-group">
              <label>Descripción de daño</label>
              <input class="rt-input" id="damageDescription">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="rt-btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="rt-btn-primary" id="confirmReturn">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rt-bottom"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Router.guard(['PROVIDER']);

    const returnModal = new bootstrap.Modal(document.getElementById('returnModal'));

    UI.qs('#rentalActionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = UI.qs('#rentalId').value.trim();
      const action = UI.qs('#rentalAction').value;
      if (!id) return;

      if (action === 'return') {
        UI.qs('#returnRentalId').value = id;
        UI.qs('#damaged').value = 'false';
        UI.qs('#damageDescription').value = '';
        returnModal.show();
        return;
      }

      await Api.apiClient.patch(`/api/provider/rentals/${id}/${action}`, {});
      UI.toast('Acción ejecutada', 'success');
      e.target.reset();
    });

    UI.qs('#confirmReturn').addEventListener('click', async () => {
      const id = UI.qs('#returnRentalId').value.trim();
      const payload = {
        damaged: UI.qs('#damaged').value === 'true',
        damageDescription: UI.qs('#damageDescription').value.trim()
      };
      await Api.apiClient.patch(`/api/provider/rentals/${id}/return`, payload);
      UI.toast('Devolución registrada', 'success');
      returnModal.hide();
      UI.qs('#rentalActionForm').reset();
    });
  </script>
</body>
</html>
